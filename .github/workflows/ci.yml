name: Portal CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:components
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
